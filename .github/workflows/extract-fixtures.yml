name: Extract Fixtures

on:
  schedule:
    - cron: '0 6 * * 1,4'  # Mon and Thu at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r Documents/pitchfit-dev/requirements.txt

      - name: Run fixture extractor
        working-directory: Documents/pitchfit-dev
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pitchfit_extractor.py --club-id ${{ secrets.SUPABASE_CLUB_ID }}
